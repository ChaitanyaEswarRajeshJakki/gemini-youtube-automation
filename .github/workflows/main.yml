name: Web Designs Online Production

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: youtube-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore OAuth files
        env:
          CLIENT_SECRET_B64: ${{ secrets.CLIENT_SECRET_B64 }}
          CREDENTIALS_B64: ${{ secrets.CREDENTIALS_B64 }}
        run: |
          echo "$CLIENT_SECRET_B64" | base64 --decode > client_secrets.json
          echo "$CREDENTIALS_B64" | base64 --decode > credentials.json
      - name: Produce private video
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_MODELS: gemini-3.6-flash,gemini-2.5-flash-lite,gemini-2.0-flash
          YOUTUBE_PRIVACY_STATUS: private
        run: python main.py --full
      - name: Commit generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data config output || true
          git diff --cached --quiet || git commit -m "chore: update channel production state"
          git push
      - name: Remove credentials
        if: always()
        run: rm -f client_secrets.json credentials.json
